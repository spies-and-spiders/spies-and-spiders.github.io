name: Build and Deploy Pages

on:
   push:
      branches:
         - main
   # Allow running manually from the actions tab
   workflow_dispatch:


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
   contents: read
   pages: write
   id-token: write

concurrency:
   group: "pages"
   cancel-in-progress: true

jobs:
   # Single deploy job since we're just deploying
   deploy:
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}

      runs-on: ubuntu-latest

      steps:
         - name: Free Disk Space
           uses: endersonmenezes/free-disk-space@v3
           with:
              remove_android: true
              remove_dotnet: true
              remove_haskell: true
              remove_tool_cache: true
              remove_swap: true
              remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
              remove_packages_one_command: true
              remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
              rm_cmd: "rmz"
              rmz_version: "3.1.1"

         - uses: actions/setup-node@v4
           with:
              node-version: 'lts/*'

         -  name: Checkout
            uses: actions/checkout@master

         - uses: DeLaGuardo/setup-clojure@13.6.0
           with:
             bb: latest
        # Notably: remove anything which should not be added to the service worker manifest:
        #  - `homebrew`
        #  - `prerelease`
         - name: Cleanup
           run: |
             rm -rf *.md *.zip scss spellcheck
             ls -lah
         - name: Generate various JS files and data
           run: ./scripts/generate-content.sh
         - uses: actions/upload-artifact@v7
           with:
             name: sns.json
             path: homebrew/sns.json

         -  name: Build SEO Pages
            env:
               VET_SEO_IS_DEV_MODE: true
               VET_BASE_SITE_URL: "https://${{ github.repository_owner }}.github.io/"
               VET_SEO_IS_SKIP_UA_ETC: true
            run: |
               npm run build:seo -- ${{ github.ref_name }}

         -  name: Cleanup
            run: |
               rm -rf node_modules node
               ls -lah

         -  name: Setup Pages
            uses: actions/configure-pages@v5

         -  name: Upload artifact
            uses: actions/upload-pages-artifact@v4
            with:
              path: '.'

         -  name: Deploy to GitHub Pages
            id: deployment
            uses: actions/deploy-pages@v5
            with:
              # Timeout in millis (10 mins)
              timeout: 600000
